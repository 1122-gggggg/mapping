[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfm-mapping"
version = "0.1.0"
description = "Build localizable SfM maps (S0-S9) and diagnose them (MapDoctor + sfm-diagnosis)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "networkx>=3.0",
  "pandas>=2.0",
  "Pillow>=10.0",
  "opencv-python-headless>=4.8",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
colmap = ["pycolmap>=3.11"]
viz = ["plotly>=5.18"]
video = ["opencv-python-headless>=4.8"]
dino = ["torch>=2.1", "torchvision>=0.16", "transformers>=4.40"]
parquet = ["pyarrow>=15.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
sfm-qa = "sfm_qa.cli:main"
mapdoctor = "mapdoctor.cli:main"
sfm-diagnosis = "sfm_diagnosis.cli:main"
update-map = "update_map.cli:app"
sfm-graph-harden = "sfm_qa.session_select.paper_graph_cli:main"

[project.urls]
Homepage = "https://github.com/1122-gggggg/mapping"
Issues = "https://github.com/1122-gggggg/mapping/issues"

[tool.setuptools.packages.find]
where = ["diagnosis/src", "map_update/lifelong/src"]

[tool.setuptools.package-data]
"sfm_qa.session_select" = ["defaults.yaml"]

[tool.pytest.ini_options]
testpaths = ["sites", "map_update", "pipeline", "diagnosis/tests", "tools"]
addopts = "-q --import-mode=importlib"
pythonpath = ["diagnosis/src", "diagnosis/tests/sfm_diagnosis", "tools"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"diagnosis/src/sfm_diagnosis/evidence.py" = ["F402"]
