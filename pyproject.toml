[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfm-map-diagnosis"
version = "0.1.0"
description = "Map-first then SfM localization diagnosis: MapDoctor + sfm-diagnosis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "sfm-map-diagnosis contributors"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
colmap = ["pycolmap>=3.11"]
viz = ["plotly>=5.18"]
video = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sfm-qa = "sfm_qa.cli:main"
mapdoctor = "mapdoctor.cli:main"
sfm-diagnosis = "sfm_diagnosis.cli:main"

[project.urls]
Homepage = "https://github.com/1122-gggggg/sfm_map_diagnosis"
Issues = "https://github.com/1122-gggggg/sfm_map_diagnosis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sfm_qa.session_select" = ["defaults.yaml"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["tests/sfm_diagnosis"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/sfm_diagnosis/evidence.py" = ["F402"]
