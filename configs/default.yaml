paths:
  base_map: ""
  current_images: ""
  historical_data: ""
  current_validation: ""
  precomputed_edm: ""
  precomputed_change_masks: ""
  output_root: "runs"

quality:
  blur_good: 1400.0
  blur_reject: 150.0
  dark_mean_reject: 20.0
  bright_mean_reject: 235.0
  clipped_ratio_reject: 0.35
  entropy_reject: 2.5
  duplicate_hamming_threshold: 4
  min_frame_gap: 1

lifting:
  snap_radius_px: 2.0
  uniqueness_margin_px: 0.5
  require_stable_mask: true
  allow_current_real: true
  allow_feedforward_verified: true
  allow_virtual_ba_only: false
  min_confidence: 0.05
  query_merge_radius_px: 2.0

pose:
  ransac_reprojection_px: 4.0
  ransac_iterations: 5000
  ransac_confidence: 0.999
  refine_loss: huber
  refine_f_scale: 2.0
  cluster_rotation_deg: 5.0
  cluster_translation: 0.1
  dominant_cluster_ratio: 1.5
  characteristic_length: 1.0
  pixel_sigma: 1.0
  gate:
    min_unique_point3d: 30
    target_unique_point3d: 50
    min_inlier_ratio: 0.25
    max_reprojection_p90_px: 3.0
    min_convex_hull_ratio: 0.15
    min_grid_occupancy: 6
    required_positive_depth_ratio: 1.0
    min_independent_reference_support: 2
    max_pose_modes: 1
    max_fim_condition_number: 1000.0
    max_translation_std: 0.2
    max_rotation_std_deg: 3.0

change:
  stable_ratio_active: 0.70
  stable_ratio_candidate: 0.30
  absdiff_threshold: 0.15
  structural_threshold: 0.20
  min_multiview_votes: 2
  uncertainty_band: 0.05
  morphology_kernel: 3
  min_component_area: 64

bridge:
  min_edge_matches: 30
  min_edge_inliers: 20
  min_edge_inlier_ratio: 0.20
  min_edge_spatial_coverage: 0.10
  min_edge_confidence: 0.50
  max_bridge_depth: 5
  min_current_point3d_for_pnp: 30
  min_anchor_count: 2
  min_disjoint_paths: 2
  max_rotation_cycle_deg: 3.0
  max_translation_cycle: 0.5
  max_scale_cycle_fraction: 0.05
  sim3_ransac_threshold: 0.2
  sim3_ransac_iterations: 2000

selection:
  budget: 500
  min_k_cover: 2
  min_total_utility: 0.0
  pose_translation_redundancy: 0.25
  pose_rotation_redundancy_deg: 10.0
  landmark_jaccard_redundancy: 0.85
  descriptor_cosine_redundancy: 0.95
  weights:
    viewpoint_gain: 1.0
    edm_success_gain: 3.0
    pose_information_gain: 1.0
    stable_ratio: 0.5
    redundancy_penalty: 1.0
    runtime_cost: 0.5
    risk_penalty: 2.0

stability:
  decay_per_day: 0.995
  confirmation_gain: 0.10
  conflict_penalty: 0.25
  change_penalty: 0.30
  false_pose_penalty: 0.60
  unmatched_penalty: 0.0
  suspect_threshold: 0.30
  retire_threshold: 0.10
  active_threshold: 0.60

validation:
  success_translation_thresholds_m: [0.25, 0.5, 1.0]
  success_rotation_thresholds_deg: [2.0, 5.0, 10.0]
  common_success_inlier_max_drop_fraction: 0.05
  require_zero_new_false_rejections: true
  require_zero_new_confident_wrong_poses: true
  max_p95_latency_increase_fraction: 0.25
  min_weak_cell_success_gain: 0.0
  min_failure_run_reduction: 0.0

adapters:
  retrieval_type: precomputed
  matcher_type: precomputed
  retrieval_file: ""
  matches_root: ""
  python_retriever: ""
  python_matcher: ""
  command_retriever: ""
  command_matcher: ""
  top_k: 30

route_cells:
  position_bin_size: 2.0
  height_bin_size: 2.0
  yaw_bin_deg: 15.0
  pitch_bin_deg: 15.0

random_seed: 20260818
