name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=update_map --cov-report=term-missing
      - run: update-map synthetic-demo --output runs/ci_synthetic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-${{ matrix.python-version }}
          path: runs/ci_synthetic
