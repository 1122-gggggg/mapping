name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-selection-and-diagnosis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint optimized core
        run: |
          ruff check \
            diagnosis/src/sfm_diagnosis/graph.py \
            diagnosis/src/sfm_diagnosis/report.py \
            diagnosis/src/sfm_diagnosis/weak_regions.py \
            diagnosis/src/sfm_qa/cli.py \
            diagnosis/src/sfm_qa/bridge.py \
            diagnosis/src/sfm_qa/pipeline.py \
            diagnosis/src/sfm_qa/gate_attachments.py \
            diagnosis/src/sfm_qa/relative_quality.py \
            diagnosis/src/sfm_qa/session_select \
            diagnosis/tests/sfm_diagnosis/test_graph.py \
            diagnosis/tests/sfm_qa \
            map_update/lifelong/src/update_map/geometry.py \
            map_update/lifelong/src/update_map/stability.py \
            map_update/lifelong/tests/test_bridge.py \
            map_update/lifelong/tests/test_pose.py \
            map_update/lifelong/tests/test_stability.py \
            map_update/core/point_evidence_ledger.py \
            map_update/core/test_point_evidence_recency.py \
            tools
      - name: Test session selection and diagnosis contracts
        run: |
          pytest -q diagnosis/tests tools/test_diagnose_map.py tools/test_diagnosis_layout.py tools/test_diagnose_update.py
      - name: Test point-evidence maintenance
        run: |
          PYTHONPATH=map_update/core pytest -q \
            map_update/core/test_point_evidence_ledger.py \
            map_update/core/test_point_evidence_recency.py \
            map_update/core/test_update_quality_gates.py \
            map_update/core/test_changed_region_evidence.py
      - name: Test lightweight lifelong map update
        run: |
          PYTHONPATH=map_update/lifelong/src pytest -q map_update/lifelong/tests
      - name: Test map update path contracts
        run: |
          PYTHONPATH=map_update pytest -q \
            map_update/test_inrepo_path_contracts.py \
            map_update/test_update_pipeline_sparsify.py
      - name: Test live pipeline utilities
        run: |
          PYTHONPATH=pipeline pytest -q \
            pipeline/test_build_gravity_alignment.py \
            pipeline/test_intrinsics_holdout_gate.py \
            pipeline/test_plan_db_reuse_sweep.py \
            pipeline/test_plan_research_method_experiments.py \
            pipeline/test_pose_graph_init.py \
            pipeline/test_ggpt_sidecar.py \
            pipeline/test_recompute_site_scale.py \
            pipeline/test_verify_gauge_invariance.py \
            pipeline/test_build_localizable_map_core.py::PairGraphPerformanceTests \
            pipeline/test_build_localizable_map_core.py::MotionClassificationTests \
            pipeline/test_build_localizable_map_core.py::PaperMethodIntegrationTests \
            pipeline/test_build_localizable_map_core.py::PycolmapDatabaseCompatTests \
            pipeline/test_build_localizable_map_core.py::ColmapSqliteSummaryTests
